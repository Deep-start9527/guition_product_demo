devices:
- name: display_lcd
  type: display_lcd
  version: 1.0.0
  sub_type: spi
  chip: st7796
  config:
    x_max: 240
    y_max: 320
    swap_xy: false
    mirror_x: false
    mirror_y: false
    invert_color: true
    need_reset: true
    frame_format: RGB565_BE
    io_spi_config:
      cs_gpio_num: 15
      dc_gpio_num: 2
      spi_mode: 0
      pclk_hz: 40000000
      trans_queue_depth: 10
      lcd_cmd_bits: 8
      lcd_param_bits: 8
    lcd_panel_config:
      reset_gpio_num: -1
      bits_per_pixel: 16
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_BIG
      flags:
        reset_active_high: false
  peripherals:
  - spi_name: spi_display
  dependencies:
    espressif/esp_lcd_st7796: ==1.3.5
- name: lcd_touch
  type: custom
  chip: guition_touch
  config: {}
  dependencies:
    espressif/esp_lcd_touch_gt911:
      version: ==1.2.1
      public: true
      matches:
      - if: $CONFIG{GUITION_TOUCH_CAPACITIVE} == True
    atanisoft/esp_lcd_touch_xpt2046:
      version: ==1.0.6
      public: true
      matches:
      - if: $CONFIG{GUITION_TOUCH_RESISTIVE} == True
- name: lcd_brightness
  type: ledc_ctrl
  config:
    default_percent: 100
  peripherals:
  - ledc_name: ledc_backlight
