# Peripherals Configuration for JC1060P470C_I_Y
peripherals:
  # I2C Configuration
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 7
        scl: 8

  # I2S configuration for full-duplex audio with ES8389
  - name: i2s_audio_out
    type: i2s
    role: master
    format: tdm-out
    config: &i2s_audio_config
      port: 0
      sample_rate_hz: 44100
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      pins:
        mclk: 13
        bclk: 12
        ws: 10
        dout: 9
        din: 11

    # I2S configuration for full-duplex audio with ES8389
  - name: i2s_audio_in
    type: i2s
    role: master
    format: tdm-in
    config: *i2s_audio_config
      

  # PA CONTROL
  - name: gpio_pa_control
    type: gpio
    role: io
    config:
      pin: 20
      mode: GPIO_MODE_OUTPUT
      pull_up: true
      default_level: 0

  # LDO Configuration for MIPI Power Supply, need to be initialized before MIPI.
  - name: ldo_mipi
    type: ldo
    config:
      chan_id: 3        # On the P4 function board, VO3_LDO is used to power mipi.
      voltage_mv: 2500  # For MIPI, the operating voltage needs to be set to 2.5V.
      adjustable: 1
      owned_by_hw: 0

  # DSI Configuration
  - name: dsi_display
    type: dsi
    config:
      bus_id: 0
      data_lanes: 2
      phy_clk_src: 0
      lane_bit_rate_mbps: 750

  # Backlight Control
  - name: ledc_backlight
    type: ledc
    version: default
    config:
      gpio_num: 23
      speed_mode: LEDC_LOW_SPEED_MODE
      channel: 1
      timer_sel: 1
      duty: 0

  - name: uart_1
    type: uart
    config:
      uart_num: 1
      rx_buffer_size: 256
      tx_buffer_size: 256
      tx_io_num:  26                     # [IO] GPIO number for TX pin
      rx_io_num: 27                     # [IO] GPIO number for RX pin
      rts_io_num: -1                    # [IO] GPIO number for RTS pin
      cts_io_num: -1                    # [IO] GPIO number for CTS pin
      uart_mode: UART_MODE_UART
      use_queue: false
      queue_size: 10
      intr_alloc_flags: 0
      uart_config:
        baud_rate: 921600               # Baud rate in bits per second
        data_bits: UART_DATA_8_BITS
        parity: UART_PARITY_DISABLE
        stop_bits: UART_STOP_BITS_1
        flow_ctrl: UART_HW_FLOWCTRL_DISABLE
        rx_flow_ctrl_thresh: 0
        source_clk: UART_SCLK_DEFAULT
        lp_source_clk: NULL
        flags:
          allow_pd: 0
          backup_before_sleep: 0
